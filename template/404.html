<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Cloudflare Pages بيعرض الصفحة دي بكود 404 لأي لينك مش موجود، بدل ما يرجّع الصفحة الرئيسية بكود 200 -->
  <meta name="robots" content="noindex">
  <title>الصفحة مش موجودة · {{name}}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{fontUrl}}">
  <link rel="stylesheet" href="/brand.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--brand-bg);
      color: var(--brand-ink);
      font-family: var(--brand-font);
      line-height: 1.7;
      text-align: center;
    }
    h1 { margin: 0 0 8px; color: var(--brand-accent-dark); }
    p { margin: 0 0 20px; color: var(--brand-muted); }
    a {
      display: inline-block;
      font-weight: 700;
      color: #fff;
      background: var(--brand-accent-dark);
      border-radius: 10px;
      padding: 12px 20px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>الصفحة دي مش موجودة</h1>
    <p>يمكن اللينك اتغيّر أو فيه حرف غلط.</p>
    <a href="/">ارجع لصفحة {{name}}</a>
  </main>
</body>
</html>
